# nginx site for masjid-website-kit. Copy to /etc/nginx/sites-available/masjid-website,
# replace example.org with your domain (3 places), then:
#   ln -s /etc/nginx/sites-available/masjid-website /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# Get the certificate first with the port-80 block only (see docs/DEPLOY.md).

upstream masjid_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.org www.example.org;

    # Let's Encrypt renewals (certbot --webroot -w /var/www/html)
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://example.org$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.org www.example.org;

    ssl_certificate     /etc/letsencrypt/live/example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.org/privkey.pem;

    # Send www to the bare domain.
    if ($host = www.example.org) { return 301 https://example.org$request_uri; }

    # Image uploads (event posters, phone upload links) up to ~10 MB.
    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # MCP endpoint used by Claude: stream responses, allow long tool calls.
    location = /api/mcp {
        proxy_pass http://masjid_app;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://masjid_app;
    }
}
